[functions]
directory = "netlify/functions"

# Daily OAuth token refresh sweep -- keeps every customer's Zoho/QuickBooks
# connection alive and flags anything broken before it silently fails an
# invoice sync. See netlify/functions/oauth-refresh-sweep.js.
[functions."oauth-refresh-sweep"]
schedule = "@daily"

# Review-request sweep -- runs every 30 minutes, sends the customer's
# review-request text once their scheduledFor time (24hr after invoice)
# has passed. See netlify/functions/review-request-sweep.js.
[functions."review-request-sweep"]
schedule = "*/30 * * * *"
