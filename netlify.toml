[build]
  command = "cd relay-pwa/functions && npm install --omit=dev"
  publish = "relay-pwa"
  base = "."

[functions]
  directory = "relay-pwa/functions"
  node_bundler = "esbuild"

# Daily OAuth token refresh sweep
[functions."oauth-refresh-sweep"]
schedule = "0 8 * * *"

# Hourly review-request sweep. This function was written to run on a schedule
# (see its header) but was never registered here, so it had never once run.
[functions."review-request"]
schedule = "0 * * * *"
