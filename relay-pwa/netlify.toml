# Relay portal configuration
#
# THIS IS THE ONLY netlify.toml THAT NETLIFY READS.
#
# The Netlify UI sets "Base directory" to relay-pwa, so Netlify resolves its
# config from relay-pwa/netlify.toml — not from the repo root. A second
# netlify.toml used to sit at the repo root; it was silently ignored on every
# build, which made root-level config changes look applied when they were not.
# It has been deleted. Keep all build config here.
#
# All paths below are relative to this directory (the base directory).

[build]
  publish = "."
  # Install the functions' production dependencies. This was previously
  # command = "true" (a no-op), so npm install never ran and every function
  # crashed at import with ERR_MODULE_NOT_FOUND on stripe / firebase-admin.
  command = "cd functions && npm install --omit=dev"

[functions]
  directory = "functions"
  # Bundle each function with its dependencies into a self-contained bundle.
  node_bundler = "esbuild"

# ── Scheduled functions ──────────────────────────────────────────────────────
# oauth-refresh-sweep also declares its own schedule via `export const config`
# in the function file, which is the authoritative v2 mechanism. Listed here
# too so both scheduled jobs are visible in one place.

[functions."review-request"]
  schedule = "0 * * * *"

[functions."oauth-refresh-sweep"]
  schedule = "0 8 * * *"

# Daily Firestore snapshot to Netlify Blobs. 07:00 UTC = 03:00 ET, deliberately
# an hour before the token sweep so the snapshot predates the day's writes.
# firestore-backup.mjs also declares this via `export const config`.
[functions."firestore-backup"]
  schedule = "0 7 * * *"

# ── Redirects ────────────────────────────────────────────────────────────────

# Block static serving of server-side source. The functions directory lives
# inside the publish directory, so Netlify was serving every .mjs file as a
# static asset: portal-relay.com/functions/stripe-webhook.mjs returned the
# source. Verified exposed before this rule.
#
# Functions EXECUTE at /.netlify/functions/*, which these rules do not touch,
# so invocation is unaffected. force = true is required: without it a real file
# on disk wins over a redirect.
[[redirects]]
  from = "/functions/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/index.html"
  status = 404
  force = true


[[redirects]]
  from = "/doc/*"
  to = "/doc.html"
  status = 200

[[redirects]]
  from = "/"
  to = "/landing.html"
  status = 200
  force = true

# The public SMS opt-in form. Named explicitly rather than relying on the
# catch-all so it is unmistakably a real, linkable page - this URL goes on the
# Twilio toll-free verification submission.
[[redirects]]
  from = "/signup"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── Headers ──────────────────────────────────────────────────────────────────

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
